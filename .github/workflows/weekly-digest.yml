name: weekly-digest

# Auto-publishes a one-paragraph digest to dev.to every Monday using the npm
# changelog deltas of all 9 depmedic CLIs since the previous Monday. Keeps a
# fresh canonical post going out under @depmedicdevbyte forever, even when
# the maintainer is offline.

on:
  schedule:
    # 13:00 UTC Monday = 08:00 America/Chicago Monday morning
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate weekly digest
        env:
          DEVTO_API_TOKEN: ${{ secrets.DEVTO_API_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .scripts/weekly-digest.mjs

      - name: Commit + push if changed
        run: |
          git config user.name "depmedic-bot"
          git config user.email "depmedic.dev@gmail.com"
          git add blog/ rss.xml sitemap.xml .scripts/digest-state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no new digest content"
            exit 0
          fi
          git commit -m "weekly: auto digest"
          git push

      - name: Ping IndexNow
        if: success()
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data '{"host":"depmedicdev-byte.github.io","key":"3974f3b9671f8328b2e065e0fd2a21f6","keyLocation":"https://depmedicdev-byte.github.io/3974f3b9671f8328b2e065e0fd2a21f6.txt","urlList":["https://depmedicdev-byte.github.io/sitemap.xml","https://depmedicdev-byte.github.io/rss.xml"]}' \
            https://api.indexnow.org/indexnow || true
