<!doctype html>
<html><head><meta charset="utf-8"><title>Unsubscribe - depmedic</title>
<style>:root{color-scheme:dark}body{background:#0b0d10;color:#e6e8eb;font:16px/1.5 ui-sans-serif,system-ui,sans-serif;margin:0;padding:48px 24px;display:flex;justify-content:center}.box{max-width:560px;background:#11151b;border:1px solid #2a3744;border-radius:10px;padding:24px}h1{margin:0 0 8px}p{margin:8px 0;color:#b6bec7}a{color:#6cb6ff}button{background:#7a2d2d;color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}</style>
</head><body>
<div class="box" id="box"><p>Loading...</p></div>
<script src="/newsletter-config.js"></script>
<script>
(async()=>{const u=new URL(location.href);const t=u.searchParams.get('t');const box=document.getElementById('box');if(!t){box.innerHTML='<h1>Missing token.</h1><p>Use the unsubscribe link in your most recent newsletter.</p>';return;}const base=(window.NEWSLETTER_API||'').replace(/\/$/,'');if(!base){box.innerHTML='<h1>Endpoint not configured.</h1>';return;}box.innerHTML='<h1>Unsubscribe?</h1><p>One click and you stop receiving depmedic weekly. You can re-subscribe at any time at <a href="/newsletter.html">/newsletter.html</a>.</p><button id="b">Yes, unsubscribe</button>';document.getElementById('b').addEventListener('click',async()=>{try{const r=await fetch(base+'/api/unsubscribe?t='+encodeURIComponent(t));const html=await r.text();box.innerHTML=html||'<h1>Unsubscribed.</h1>';}catch(e){box.innerHTML='<h1>Network error.</h1><p>'+(e.message||e)+'</p>';}});})();
</script>
</body></html>
